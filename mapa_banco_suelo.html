<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Banco de Suelo Municipal — Recoleta</title>
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css" rel="stylesheet" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --negro: #0f0f0f;
      --blanco: #f5f3ee;
      --acento: #c8f04a;
      --acento2: #4a8ff0;
      --gris: #2a2a2a;
      --gris2: #3d3d3d;
      --texto-muted: #888;
    }

    body {
      font-family: 'DM Mono', monospace;
      background: var(--negro);
      color: var(--blanco);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* HEADER */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      height: 52px;
      background: var(--negro);
      border-bottom: 1px solid var(--gris2);
      flex-shrink: 0;
      z-index: 10;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .header-badge {
      background: var(--acento);
      color: var(--negro);
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 2px;
    }

    .header-title {
      font-family: 'Syne', sans-serif;
      font-weight: 600;
      font-size: 14px;
      letter-spacing: 0.04em;
      color: var(--blanco);
    }

    .header-meta {
      font-size: 11px;
      color: var(--texto-muted);
      letter-spacing: 0.06em;
    }

    #contador {
      font-family: 'Syne', sans-serif;
      font-size: 13px;
      color: var(--acento);
      font-weight: 600;
    }

    /* LAYOUT PRINCIPAL */
    .main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* MAPA */
    #map {
      flex: 1;
      height: 100%;
    }

    /* PANEL LATERAL */
    .panel {
      width: 320px;
      background: var(--negro);
      border-left: 1px solid var(--gris2);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex-shrink: 0;
    }

    .panel-header {
      padding: 16px 20px 12px;
      border-bottom: 1px solid var(--gris2);
    }

    .panel-header h2 {
      font-family: 'Syne', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--texto-muted);
      margin-bottom: 10px;
    }

    #buscar {
      width: 100%;
      background: var(--gris);
      border: 1px solid var(--gris2);
      border-radius: 4px;
      padding: 8px 12px;
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      color: var(--blanco);
      outline: none;
      transition: border-color 0.2s;
    }

    #buscar::placeholder { color: var(--texto-muted); }
    #buscar:focus { border-color: var(--acento); }

    /* LISTA */
    .lista-container {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }

    .lista-container::-webkit-scrollbar { width: 4px; }
    .lista-container::-webkit-scrollbar-track { background: var(--negro); }
    .lista-container::-webkit-scrollbar-thumb { background: var(--gris2); border-radius: 2px; }

    .item {
      padding: 10px 20px;
      cursor: pointer;
      border-left: 2px solid transparent;
      transition: all 0.15s;
    }

    .item:hover {
      background: var(--gris);
      border-left-color: var(--acento2);
    }

    .item.activo {
      background: var(--gris);
      border-left-color: var(--acento);
    }

    .item-id {
      font-size: 10px;
      color: var(--acento);
      letter-spacing: 0.08em;
      margin-bottom: 2px;
    }

    .item-dir {
      font-size: 12px;
      color: var(--blanco);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-rol {
      font-size: 10px;
      color: var(--texto-muted);
      margin-top: 2px;
    }

    /* POPUP */
    .mapboxgl-popup-content {
      background: var(--negro) !important;
      border: 1px solid var(--gris2) !important;
      border-radius: 6px !important;
      padding: 0 !important;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6) !important;
      min-width: 260px;
      max-width: 300px;
    }

    .mapboxgl-popup-tip { display: none !important; }
    .mapboxgl-popup-close-button {
      color: var(--texto-muted) !important;
      font-size: 18px !important;
      padding: 6px 10px !important;
      right: 2px !important;
      top: 2px !important;
    }
    .mapboxgl-popup-close-button:hover { color: var(--blanco) !important; background: none !important; }

    .popup-inner {
      padding: 16px;
    }

    .popup-id {
      font-size: 10px;
      color: var(--acento);
      letter-spacing: 0.1em;
      margin-bottom: 6px;
    }

    .popup-dir {
      font-family: 'Syne', sans-serif;
      font-size: 14px;
      font-weight: 600;
      color: var(--blanco);
      margin-bottom: 12px;
      line-height: 1.3;
    }

    .popup-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }

    .popup-campo {
      background: var(--gris);
      border-radius: 4px;
      padding: 6px 8px;
    }

    .popup-campo.full {
      grid-column: 1 / -1;
    }

    .popup-label {
      font-size: 9px;
      color: var(--texto-muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .popup-valor {
      font-size: 11px;
      color: var(--blanco);
      font-weight: 500;
    }

    .popup-link {
      display: block;
      text-align: center;
      padding: 8px;
      background: var(--acento);
      color: var(--negro);
      font-family: 'Syne', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-decoration: none;
      border-radius: 4px;
      margin-top: 4px;
      transition: opacity 0.15s;
    }

    .popup-link:hover { opacity: 0.85; }
    .popup-link-vacio {
      display: none;
    }

    /* LOADING */
    #loading {
      position: fixed;
      inset: 0;
      background: var(--negro);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      gap: 16px;
    }

    .loading-logo {
      font-family: 'Syne', sans-serif;
      font-size: 22px;
      font-weight: 700;
      color: var(--blanco);
    }

    .loading-logo span { color: var(--acento); }

    .loading-bar {
      width: 200px;
      height: 2px;
      background: var(--gris2);
      border-radius: 2px;
      overflow: hidden;
    }

    .loading-bar-inner {
      height: 100%;
      background: var(--acento);
      border-radius: 2px;
      animation: carga 1.8s ease-in-out infinite;
    }

    @keyframes carga {
      0% { width: 0%; margin-left: 0%; }
      50% { width: 60%; margin-left: 20%; }
      100% { width: 0%; margin-left: 100%; }
    }

    .loading-txt {
      font-size: 11px;
      color: var(--texto-muted);
      letter-spacing: 0.1em;
    }

    /* ESTADO VACÍO */
    .sin-datos {
      padding: 32px 20px;
      text-align: center;
      color: var(--texto-muted);
      font-size: 12px;
    }
  </style>
</head>
<body>

<div id="loading">
  <div class="loading-logo">Banco de <span>Suelo</span></div>
  <div class="loading-bar"><div class="loading-bar-inner"></div></div>
  <div class="loading-txt">Cargando inmuebles municipales...</div>
</div>

<header>
  <div class="header-left">
    <div class="header-badge">Recoleta</div>
    <div class="header-title">Banco de Suelo Municipal</div>
  </div>
  <div class="header-meta">
    <span id="contador">— inmuebles</span>
  </div>
</header>

<div class="main">
  <div id="map"></div>
  <div class="panel">
    <div class="panel-header">
      <h2>Inmuebles</h2>
      <input type="text" id="buscar" placeholder="Buscar por ID, ROL o dirección..." />
    </div>
    <div class="lista-container" id="lista"></div>
  </div>
</div>

<script>
  mapboxgl.accessToken = 'pk.eyJ1IjoicnVwYW5jbyIsImEiOiJjbTdndm4xMGkwZGQ3MmpzOTN6Mzk0dWhzIn0.y5ECbRFBDTPcqgGvkHCBmQ';

  const GEOJSON_URL = 'https://raw.githubusercontent.com/datos-recoleta/banco-suelo/main/cartografia/inmuebles_banco_suelo.geojson';
  const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSD32rwi3Ed3sQ0w6bQQYBbATcz1QuRyYq17crO2E6lPnPMd0ZOGdT-Is4PQEzGI7gjTjkP0NjLROtA/pub?gid=1728987519&single=true&output=csv';

  const map = new mapboxgl.Map({
    container: 'map',
    style: 'mapbox://styles/mapbox/dark-v11',
    center: [-70.6406, -33.4000],
    zoom: 13,
    attributionControl: false
  });

  map.addControl(new mapboxgl.NavigationControl({ showCompass: false }), 'top-left');
  map.addControl(new mapboxgl.AttributionControl({ compact: true }), 'bottom-left');

  let datosSheets = {};
  let geojsonData = null;
  let popupActivo = new mapboxgl.Popup({ closeButton: true, maxWidth: '320px' });
  let itemActivo = null;

  // Parse CSV simple
  function parseCSV(texto) {
    const lineas = texto.trim().split('\n');
    const headers = lineas[0].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
    const filas = {};
    for (let i = 1; i < lineas.length; i++) {
      const cols = lineas[i].match(/(".*?"|[^,]+|(?<=,)(?=,)|^(?=,)|(?<=,)$)/g) || [];
      const fila = {};
      headers.forEach((h, idx) => {
        fila[h] = (cols[idx] || '').trim().replace(/^"|"$/g, '');
      });
      const id = fila['ID'] || fila['id'] || '';
      if (id) filas[id] = fila;
    }
    return filas;
  }

  function val(fila, campo) {
    if (!fila) return '—';
    const v = fila[campo];
    return (v && v.trim() !== '') ? v.trim() : '—';
  }

  function formatPeso(v) {
    if (!v || v === '—') return '—';
    const n = parseInt(v.replace(/\D/g, ''));
    if (isNaN(n)) return v;
    return '$' + n.toLocaleString('es-CL');
  }

  function construirPopupHTML(props, fila) {
    const id = props.ID || '—';
    const rol = props.ROL || val(fila, 'ROL SII');
    const dir = fila ? (val(fila, 'DIRECCION') + (val(fila, 'N° DOMICILIARIO') !== '—' ? ' ' + val(fila, 'N° DOMICILIARIO') : '')) : '—';
    const sup = val(fila, 'SUPERFICIE TERRENO m2');
    const uso = val(fila, 'USO ACTUAL ') || val(fila, 'USO ACTUAL');
    const estado = val(fila, 'ESTADO GENERAL INFRAESTRUCTURA');
    const avaluo = formatPeso(val(fila, 'AVALÚO FISCAL 2DO SEMESTRE 2025') || val(fila, 'AVALUO FISCAL 2DO SEMESTRE 2025'));
    const comodato = val(fila, 'EN COMODATO A');
    const link = fila ? (val(fila, 'HIPERVINCULO') || val(fila, 'HIPERVÍNCULO')) : '—';

    const linkHTML = (link && link !== '—')
      ? `<a class="popup-link" href="${link}" target="_blank">Ver ficha completa →</a>`
      : '';

    return `
      <div class="popup-inner">
        <div class="popup-id">${id}</div>
        <div class="popup-dir">${dir}</div>
        <div class="popup-grid">
          <div class="popup-campo">
            <div class="popup-label">ROL SII</div>
            <div class="popup-valor">${rol}</div>
          </div>
          <div class="popup-campo">
            <div class="popup-label">Sup. Terreno</div>
            <div class="popup-valor">${sup !== '—' ? sup + ' m²' : '—'}</div>
          </div>
          <div class="popup-campo full">
            <div class="popup-label">Uso Actual</div>
            <div class="popup-valor">${uso}</div>
          </div>
          <div class="popup-campo full">
            <div class="popup-label">Estado General</div>
            <div class="popup-valor">${estado}</div>
          </div>
          <div class="popup-campo">
            <div class="popup-label">Avalúo Fiscal</div>
            <div class="popup-valor">${avaluo}</div>
          </div>
          <div class="popup-campo">
            <div class="popup-label">En Comodato</div>
            <div class="popup-valor">${comodato}</div>
          </div>
        </div>
        ${linkHTML}
      </div>`;
  }

  function abrirPopup(feature, lngLat) {
    const props = feature.properties;
    const fila = datosSheets[props.ID] || null;
    const html = construirPopupHTML(props, fila);
    popupActivo.setLngLat(lngLat).setHTML(html).addTo(map);
  }

  function centrarEnFeature(feature) {
    // Calcular centro del polígono
    const coords = feature.geometry.coordinates[0][0];
    let lng = 0, lat = 0;
    coords.forEach(c => { lng += c[0]; lat += c[1]; });
    return [lng / coords.length, lat / coords.length];
  }

  function construirLista(features) {
    const lista = document.getElementById('lista');
    lista.innerHTML = '';

    if (features.length === 0) {
      lista.innerHTML = '<div class="sin-datos">Sin resultados</div>';
      return;
    }

    features.forEach(f => {
      const props = f.properties;
      const fila = datosSheets[props.ID] || null;
      const dir = fila
        ? (val(fila, 'DIRECCION') + (val(fila, 'N° DOMICILIARIO') !== '—' ? ' ' + val(fila, 'N° DOMICILIARIO') : ''))
        : props.ID;

      const item = document.createElement('div');
      item.className = 'item';
      item.dataset.id = props.ID;
      item.innerHTML = `
        <div class="item-id">${props.ID}</div>
        <div class="item-dir">${dir}</div>
        <div class="item-rol">ROL ${props.ROL || '—'}</div>
      `;

      item.addEventListener('click', () => {
        // Marcar activo
        document.querySelectorAll('.item').forEach(i => i.classList.remove('activo'));
        item.classList.add('activo');

        const centro = centrarEnFeature(f);
        map.flyTo({ center: centro, zoom: 16, duration: 800 });
        abrirPopup(f, centro);
      });

      lista.appendChild(item);
    });
  }

  function filtrarLista(query) {
    if (!geojsonData) return;
    const q = query.toLowerCase();
    const filtrados = geojsonData.features.filter(f => {
      const props = f.properties;
      const fila = datosSheets[props.ID] || {};
      const dir = (fila['DIRECCION'] || '') + ' ' + (fila['N° DOMICILIARIO'] || '');
      return (
        (props.ID || '').toLowerCase().includes(q) ||
        (props.ROL || '').toLowerCase().includes(q) ||
        dir.toLowerCase().includes(q)
      );
    });
    construirLista(filtrados);
  }

  document.getElementById('buscar').addEventListener('input', e => {
    filtrarLista(e.target.value);
  });

  async function cargarDatos() {
    try {
      // Cargar CSV y GeoJSON en paralelo
      const [csvRes, geoRes] = await Promise.all([
        fetch(CSV_URL),
        fetch(GEOJSON_URL)
      ]);

      const csvTexto = await csvRes.text();
      datosSheets = parseCSV(csvTexto);
      geojsonData = await geoRes.json();

      document.getElementById('contador').textContent =
        geojsonData.features.length + ' inmuebles';

      map.on('load', () => {
        map.addSource('inmuebles', {
          type: 'geojson',
          data: geojsonData
        });

        // Capa relleno
        map.addLayer({
          id: 'inmuebles-fill',
          type: 'fill',
          source: 'inmuebles',
          paint: {
            'fill-color': '#4a8ff0',
            'fill-opacity': 0.35
          }
        });

        // Capa borde
        map.addLayer({
          id: 'inmuebles-border',
          type: 'line',
          source: 'inmuebles',
          paint: {
            'line-color': '#c8f04a',
            'line-width': 1.5,
            'line-opacity': 0.9
          }
        });

        // Hover highlight
        map.addLayer({
          id: 'inmuebles-hover',
          type: 'fill',
          source: 'inmuebles',
          paint: {
            'fill-color': '#c8f04a',
            'fill-opacity': ['case', ['boolean', ['feature-state', 'hover'], false], 0.4, 0]
          }
        });

        let hoveredId = null;

        map.on('mousemove', 'inmuebles-fill', e => {
          if (e.features.length > 0) {
            map.getCanvas().style.cursor = 'pointer';
            if (hoveredId !== null) {
              map.setFeatureState({ source: 'inmuebles', id: hoveredId }, { hover: false });
            }
            hoveredId = e.features[0].id;
            map.setFeatureState({ source: 'inmuebles', id: hoveredId }, { hover: true });
          }
        });

        map.on('mouseleave', 'inmuebles-fill', () => {
          map.getCanvas().style.cursor = '';
          if (hoveredId !== null) {
            map.setFeatureState({ source: 'inmuebles', id: hoveredId }, { hover: false });
          }
          hoveredId = null;
        });

        map.on('click', 'inmuebles-fill', e => {
          const feature = e.features[0];
          const lngLat = e.lngLat;
          abrirPopup(feature, lngLat);

          // Marcar activo en lista
          const id = feature.properties.ID;
          document.querySelectorAll('.item').forEach(i => {
            i.classList.toggle('activo', i.dataset.id === id);
          });
          // Scroll a item
          const itemEl = document.querySelector(`.item[data-id="${id}"]`);
          if (itemEl) itemEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        });

        construirLista(geojsonData.features);
        document.getElementById('loading').style.display = 'none';
      });

      // Si el mapa ya cargó
      if (map.loaded()) {
        map.fire('load');
      }

    } catch (err) {
      console.error('Error cargando datos:', err);
      document.getElementById('loading').innerHTML =
        '<div style="color:#ff5555;font-family:monospace;padding:20px">Error cargando datos.<br>Revisa las URLs y el token Mapbox.</div>';
    }
  }

  cargarDatos();
</script>
</body>
</html>
